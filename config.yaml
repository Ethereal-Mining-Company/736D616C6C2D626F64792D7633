paths:
  dataset: "data/dataset-jpl-small-body-asteroids.csv"
  dataset_cleaned: "data/cleaned-dataset-jpl-small-body-asteroids.csv"
  model_dir: "models"
  experiment_log: "results/model_experiment_log.csv"

features:
  x_restricted:
    - "a"
    - "e"
    - "i"
  x_full:
    - "a"
    - "e"
    - "i"
    - "H"
  target: "diameter"
  target_col: "diameter_log"

model_params:
  rf_params:
    n_estimators: 150
    max_depth: 25
    min_samples_split: 5
    random_state: 42
    n_jobs: -1
  xgb_params:
    n_estimators: 150
    max_depth: 8
    learning_rate: 0.05
    min_samples_leaf: 2
    random_state: 42